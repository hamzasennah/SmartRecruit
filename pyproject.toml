[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [
  "backend/.venv",
  "frontend/node_modules",
  "frontend/dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
no_strict_optional = false
exclude = [
  "backend/tests",
  "backend/alembic",
]
