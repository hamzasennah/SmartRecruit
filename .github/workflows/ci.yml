name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall backend/app backend/scripts backend/tests backend/alembic
      - name: Ruff check
        run: ruff check backend
      - name: Mypy
        run: mypy backend/app
      - name: Tests
        env:
          SMARTRECRUIT_API_KEY: ci-test-key
          VECTOR_BACKEND: json
        run: coverage run -m pytest backend/tests/unit backend/tests/test_health.py && coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check / lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit
